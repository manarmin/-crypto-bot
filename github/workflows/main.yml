name: Daily Crypto RSI Scanner

on:
  schedule:
    # اجرای روزانه در ساعت ۰۸:۰۰ به وقت UTC (۱۱:۳۰ صبح به وقت تهران)
    - cron: '0 8 * * *'
  workflow_dispatch: # امکان اجرای دستی ربات از داخل تب Actions گیت‌هاب

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Bot
        run: python bot.py
